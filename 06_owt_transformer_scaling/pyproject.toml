[project]
name = "local-learning-nanogpt"
version = "0.1.0"
description = "Local-learning experiments built on nanoGPT-style language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets",
    "numpy",
    "tiktoken",
    "torch",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["local_learning_nanogpt*"]

